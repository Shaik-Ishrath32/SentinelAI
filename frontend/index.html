const stepsOf=i=>[...new Set(i.alerts.map(a=>a.rule))].flatMap(r=>PB[r]);
function run(n,ip){const atk=Date.now(),q=(c,ms,f)=>{for(let k=0;k<c;k++)setTimeout(()=>!S.paused&&f(k),k*ms)};ip=ip||EXT();
 if(n==='brute')q(9,350,k=>emit({type:k<8?'auth_fail':'auth_ok',ip,user:'admin',country:'RU',ext:1,atk}));
 if(n==='scan')q(14,200,k=>emit({type:'conn',ip,host:'web-01',port:[22,80,443,3306,3389,8080,21,25,53,110,445,5432,6379,9200][k],ext:1,atk}));
 if(n==='travel'){emit({type:'auth_ok',ip:INT(),user:'priya.n',country:'IN'});setTimeout(()=>emit({type:'auth_ok',ip,user:'priya.n',country:'RU',ext:1,atk}),1500)}
 if(n==='exfil')q(4,500,()=>emit({type:'egress',host:'db-02',ip,bytes:rnd(600,900)*1e6,ext:1,atk}));
 if(n==='anom'){S.spike=10;S.t0=atk;S.lab.add(atk)}
 if(n==='txn')q(3,600,()=>emit(txn('carol',atk)));
 if(n==='chain'){run('scan',ip);setTimeout(()=>run('brute',ip),3500);setTimeout(()=>run('exfil',ip),9500)}}
function normal(){if(S.paused)return;const r=Math.random(),u=pick(['alice','bob','carol','dev.ops']),ip=INT(),host=pick(HOSTS);
 if(r<.3)emit({type:'auth_ok',ip,user:u,country:'IN'});else if(r<.38)emit({type:'auth_fail',ip,user:u});else if(r<.68)emit({type:'http',ip,host});else if(r<.85)emit(txn(u,0));else emit({type:'egress',host,ip:EXT(),bytes:rnd(1,40)*1e6})}
function tick(){if(S.paused)return;const sp=S.spike>0&&!S.isolated.has('app-03'),pc=S.cpu[59];
 let cpu=sp?rnd(88,99):Math.max(15,Math.min(60,pc+rnd(-5,5)));if(!sp&&pc>65)cpu=rnd(35,45);const lat=sp?rnd(1400,2200):rnd(90,140);if(S.spike>0)S.spike--;setTimeout(()=>{if(!S.spike)S.t0=0},0);
 const w=S.cpu.slice(-30),m=w.reduce((a,b)=>a+b)/30,sd=Math.max(2,Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/30)),z=(cpu-m)/sd,an=Math.abs(z)>CFG.z?1:0;
 S.cpu.push(cpu);S.lat.push(lat);S.an.push(an);S.rate.push(S.cnt-S.last);S.last=S.cnt;['cpu','lat','an','rate'].forEach(k=>S[k].shift());
 if(an)raise('Metric anomaly',2,{t:Date.now(),host:'app-03',atk:S.t0},`CPU ${cpu}% (z-score ${z.toFixed(1)}), latency ${lat} ms on app-03`);render()}
function toast(t,m,sev){const d=document.createElement('div');d.className='toast';d.style.borderLeftColor=sev>=4?'var(--crit)':sev===3?'var(--high)':sev===2?'var(--med)':'var(--low)';d.innerHTML=`<b>${t}</b><br><small>${m}</small>`;$('#toasts').append(d);setTimeout(()=>d.remove(),4500)}
function line(c,series,cols,mark){const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);
 series.forEach(s=>{const mx=Math.max(...s,1)*1.15,Y=v=>h-v/mx*(h-8)-2,X=j=>j/(s.length-1)*w;x.beginPath();x.strokeStyle=cs.getPropertyValue(cols).trim();x.lineWidth=1.8;s.forEach((v,j)=>j?x.lineTo(X(j),Y(v)):x.moveTo(X(j),Y(v)));x.stroke();
  if(mark)mark.forEach((m,j)=>{if(m){x.fillStyle=cs.getPropertyValue('--crit').trim();x.beginPath();x.arc(X(j),Y(s[j]),4,0,7);x.fill()}})})}
function render(){const mean=a=>a.length?(a.reduce((x,y)=>x+y)/a.length).toFixed(1)+'s':'—',open=S.inc.filter(i=>i.status!=='Resolved');
 $('#k').innerHTML=[['Events / min',S.rate.reduce((a,b)=>a+b)],['Raw alerts',S.al.length],['ML anomalies',S.al.filter(a=>a.ml).length],['Open incidents',open.length],['Critical open',open.filter(i=>i.sev==='Critical').length],['MTTD',mean(S.det)],['MTTR',mean(S.rt)],['Alert noise cut',S.al.length?Math.round((1-S.inc.length/S.al.length)*100)+'%':'—']].map(([a,b])=>`<div class="k"><b>${b}</b><span>${a}</span></div>`).join('');
 line($('#c1'),[S.rate],'--acc');line($('#c2'),[S.cpu],'--acc',S.an);line($('#c3'),[S.lat],'--high');const sv=Math.max(0,...open.map(i=>i.risk)),hl=Math.max(5,Math.round(100-open.reduce((a,i)=>a+i.risk*.3,0)-(S.an.slice(-10).some(x=>x)?15:0)));$('#g1').innerHTML=gauge(sv,sv>=80?'var(--crit)':sv>=60?'var(--high)':sv>=35?'var(--med)':'var(--low)','Low → Critical');$('#nm').innerHTML=netmap();$('#tt').innerHTML=toptable();$('#g2').innerHTML=gauge(hl,hl>=75?'var(--low)':hl>=50?'var(--med)':'var(--crit)','Warning → Normal');
 if(S.dirty||S.tab==='feed'){S.dirty=0;list();det()}}
function list(){const t=S.tab;$('#fl').style.display=t==='inc'?'flex':'none';$('#tabs').innerHTML=[['inc',`Incidents (${S.inc.length})`],['al',`Raw alerts (${S.al.length})`],['feed','Live feed'],['evl','Evaluation'],['ast','Assets'],['rul','Rules'],['aud','Audit log']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="S.tab='${k}';S.dirty=1;render()">${l}</button>`).join('');let h='';
 if(t==='inc')h=F().length?F().map(i=>`<div class="row ${S.sel===i.id?'on':''}" onclick="S.sel='${i.id}';S.dirty=1;render()"><span class="b s-${i.sev}">${i.sev}</span><b>${i.id}</b><span class="g">${i.title}</span><b>${i.risk}</b><span class="st">${i.status}</span><small>${i.alerts.length}⚑</small></div>`).join(''):empty('No incidents yet. Use the Simulate buttons above to launch an attack.');
 if(t==='al')h=S.al.length?[...S.al].reverse().map(a=>`<div class="ev"><time>${ts(a.t)}</time><span class="b s-${a.sev}">${a.rule}</span><span>${a.msg}</span><small>→ ${a.inc}</small></div>`).join(''):empty('No alerts yet');
 if(t==='feed')h=S.ev.map(e=>`<div class="ev ${e.type}"><time>${ts(e.t)}</time><span>${e.msg}</span></div>`).join('');
 if(t==='evl'){const tp=S.al.filter(a=>a.atk).length,fp=S.al.length-tp,av=a=>a.length?a.reduce((x,y)=>x+y)/a.length:null,rs=S.inc.filter(i=>i.res),ac=rs.length?Math.round(rs.reduce((s,i)=>s+['det','ana','con','res'].filter(k=>i.st[k]).length/4,0)/rs.length*100)+'%':'—',d=av(S.det),r=av(S.rec);
h=`<div class="cfg"><b>Evaluation on labeled simulated scenarios</b><br><small>Click “Run labeled test suite” at the top: 6 labeled attacks mixed with normal traffic.</small></div>`+[['Precision (alert level)',S.al.length?(tp/S.al.length*100).toFixed(0)+'%':'—',`${tp} true / ${fp} false alerts`],['Recall (attack scenarios)',S.lab.size?(S.seen.size/S.lab.size*100).toFixed(0)+'%':'—',`${S.seen.size} of ${S.lab.size} detected`],['False-positive rate',S.nCnt?(fp/S.nCnt*1000).toFixed(2):'—',`per 1,000 normal events (${S.nCnt} seen)`],['Mean detection latency',d==null?'—':d.toFixed(2)+' s','attack start → first alert'],['Alert → recommendation',r==null?'—':r.toFixed(2)+' ms','time to score and recommend'],['Audit-trail completeness',ac,`avg of 4 stages on ${rs.length} resolved incident(s)`]].map(([a,b,c])=>`<div class="row" style="cursor:default"><span class="g">${a}</span><b>${b}</b><small>${c}</small></div>`).join('')+`<div class="cfg"><small>Prototype results on synthetic data with an in-browser Isolation Forest. They are not production measurements.</small></div>`}
 if(t==='ast'){const RL={'web-01':'Web server','web-02':'Web server','app-03':'App server','db-02':'Database'};h=HOSTS.map(x=>{const a=S.inc.filter(i=>i.status!=='Resolved'&&i.hosts.has(x)).length,iso=S.isolated.has(x);return`<div class="row" style="cursor:default"><span class="b s-${iso?2:a?4:1}">${iso?'Isolated':a?'Under attack':'Healthy'}</span><b>${x}</b><span class="g">${RL[x]}</span><small>${a} open incident(s)</small></div>`}).join('')+`<div class="cfg"><b>Blocked IPs:</b> ${[...S.blocked].join(', ')||'none'}<br><b>Disabled users:</b> ${[...S.disabled].join(', ')||'none'}</div>`}
 if(t==='rul')h=`<div class="cfg"><b>Detection thresholds</b><br><br>${[['brute','Failed logins / 60s',2,15],['scan','Distinct ports / 30s',3,20],['mb','Egress MB',100,1000],['z','Anomaly z-score',2,6],['mlp','ML score threshold %',55,90]].map(([k,l,a,b])=>`<div><span style="width:160px">${l}</span><input type="range" min="${a}" max="${b}" value="${CFG[k]}" oninput="CFG['${k}']=+this.value;this.nextElementSibling.textContent=this.value;save()"><b style="width:40px">${CFG[k]}</b></div>`).join('')}<br><b>Detectors (toggle on/off)</b>${Object.keys(PB).map(r=>`<label><input type="checkbox" ${CFG.off[r]?'':'checked'} onchange="CFG.off['${r}']=!this.checked;save()"> ${r}</label>`).join('')}</div>`;
 if(t==='aud')h=S.audit.length?S.audit.map(a=>`<div class="ev"><time>${ts(a.t)}</time><b>${a.id}</b><span>${a.m}</span></div>`).join(''):empty('No analyst or response actions yet');
 const l=$('#list'),sc=l.scrollTop;l.innerHTML=h;l.scrollTop=sc}
function det(){const i=inc(S.sel),d=$('#det');if(!i){d.innerHTML=empty('Select an incident to investigate');return}
 const ips=[...i.ips].filter(x=>!x.startsWith('10.')),B=(k,v,d)=>`<button class="danger" ${d?'disabled':''} onclick="act('${i.id}','${k}','${v}')">${d?'✓ ':''}Request: ${{ip:'block IP',user:'disable user',host:'isolate host'}[k]} ${v}</button>`;
 d.innerHTML=`<h3>${i.id} · ${i.title}</h3><div><span class="b s-${i.sev}">${i.sev}</span> Risk <b>${i.risk}/100</b></div><div class="bar"><i style="width:${i.risk}%"></i></div>
 <div class="stg">${[['det','Detection'],['ana','Analysis'],['con','Containment'],['res','Resolution']].map(([k,l])=>`<div class="${i.st[k]?'on':''}"><i></i><b>${l}</b><small>${i.st[k]?ts(i.st[k]):'pending'}</small></div>`).join('')}</div>
 <div class="why"><b>Why this fired:</b> ${i.why}</div>
 <div>${[...ips,...i.users,...i.hosts].map(x=>`<span class="chip">${x}</span>`).join('')}</div>
 <div class="sec">AI-recommended response · needs human approval</div><div class="btns">${ips.map(x=>B('ip',x,S.blocked.has(x))).join('')}${[...i.users].map(x=>B('user',x,S.disabled.has(x))).join('')}${[...i.hosts].map(x=>B('host',x,S.isolated.has(x))).join('')}</div>
 ${(i.pend||[]).length?`<div class="sec">Pending human approval</div>${i.pend.map((p,n)=>`<div class="btns" style="margin-bottom:4px"><span>${p.k} ${p.v} <small>requested by ${p.by}</small></span><button ${CFG.role!=='Admin'?'disabled title="Admin approval required"':''} onclick="ok('${i.id}',${n},1)">Approve</button><button ${CFG.role!=='Admin'?'disabled':''} onclick="ok('${i.id}',${n},0)">Reject</button></div>`).join('')}`:''}
 <div class="sec">Status workflow</div><div class="btns">${['New','Investigating','Contained','Resolved'].map(s=>`<button class="${i.status===s?'on':''}" ${s==='Resolved'&&CFG.role!=='Admin'?'disabled title="Admin only"':''} onclick="setSt('${i.id}','${s}')">${s}</button>`).join('')}</div>
 <div class="sec">Recommended playbook</div>${stepsOf(i).map((s,n)=>`<label><input type="checkbox" ${i.steps[n]?'checked':''} onchange="chk('${i.id}',${n},this.checked)"> ${s}</label>`).join('')}
 <div class="sec">Incident report</div><div class="btns"><button onclick="summ('${i.id}')">${i.sum?'Regenerate':'Generate'} AI summary</button>${i.sum?`<button onclick="navigator.clipboard&&navigator.clipboard.writeText(inc('${i.id}').sum);toast('Copied','Report copied to clipboard',1)">Copy</button>`:''}</div>${i.sum?`<pre class="sum">${i.sum}</pre>`:''}<small>Role: ${CFG.role}. Approvals and Resolve need Admin (human-in-the-loop).</small><div class="sec">Timeline</div><div class="tl">${i.tl.slice(-14).map(e=>`<div><small>${ts(e.t)}</small> ${e.m}</div>`).join('')}</div>`}
function summ(id){const i=inc(id),r=[...new Set(i.alerts.map(a=>a.rule))],acts=i.tl.filter(e=>/Response|Auto/.test(e.m)).length;
i.sum=`INCIDENT ${i.id}: ${i.title}
Severity ${i.sev} (risk ${i.risk}/100), status ${i.status}.
Detected ${ts(i.alerts[0].t)} via ${i.alerts.length} alert(s) from ${r.length} detector(s): ${r.join(', ')}.
Entities: ${[...i.ips,...i.users,...i.hosts].join(', ')}.
Assessment: ${i.why}
Response so far: ${acts} action(s) taken.
Next steps: ${stepsOf(i).filter((s,n)=>!i.steps[n]).slice(0,3).join('; ')||'all playbook steps complete'}.`;S.dirty=1;render()}
function suite(){reset();['brute','scan','travel','exfil','txn','anom'].forEach((n,k)=>setTimeout(()=>run(n),1500+k*6000));S.tab='evl';S.dirty=1;toast('Test suite started','6 labeled attacks over ~40s, watch the Evaluation tab',1)}
function pause(){S.paused=!S.paused;$('#pz').textContent=S.paused?'Resume':'Pause'}
function reset(){S=fresh();$('#pz').textContent='Pause';render()}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';render()}
const POST=(u,b)=>fetch('/api/'+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:CFG.role,...b})}).then(r=>{if(!r.ok)r.json().then(j=>toast('Rejected by backend',j.detail||'error',3))});
function startBack(){BACK=1;document.title+=' · LIVE BACKEND';$('h1 small').innerHTML+=' · <b style="color:var(--low)">LIVE BACKEND: FastAPI + scikit-learn + SQLite + WebSocket</b>';
 run=n=>POST('simulate/'+n);suite=()=>{S.tab='evl';POST('simulate/suite')};act=(id,k,v)=>POST('request',{id,k,v});ok=(id,n,yes)=>POST('approve',{id,n,yes});setSt=(id,st)=>POST('status',{id,st});chk=(id,n,c)=>POST('step',{id,n,c});pause=()=>POST('pause');reset=()=>POST('reset');const s0=summ;summ=id=>{s0(id);SUM[id]=inc(id).sum};
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onmessage=m=>{const d=JSON.parse(m.data);Object.assign(S,d,{blocked:new Set(d.blocked),disabled:new Set(d.disabled),isolated:new Set(d.isolated),seen:{size:d.seen},lab:{size:d.lab},dirty:+(S.tab!=='rul')});S.inc.forEach(i=>{i.ips=new Set(i.ips);i.users=new Set(i.users);i.hosts=new Set(i.hosts);i.sum=SUM[i.id]});if(!S.inc.some(i=>i.id===S.sel))S.sel=S.inc[0]&&S.inc[0].id;Object.assign(CFG,d.cfg,{role:CFG.role});$('#auto').checked=CFG.auto;$('#pz').textContent=S.paused?'Resume':'Pause';render()};
 ws.onclose=()=>toast('Backend disconnected','Restart the server and refresh the page',4)}
$('#role').value=CFG.role;$('#auto').checked=CFG.auto;render();fetch('/api/health').then(r=>{if(!r.ok)throw 0;return r.json()}).then(startBack).catch(()=>{setInterval(normal,550);setInterval(tick,1000)});
</script></body></html>
